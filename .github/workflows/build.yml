name: Build Aion 2 APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Drawable Icons
        run: |
          mkdir -p app/src/main/res/drawable
          rm -f app/src/main/res/drawable/*.webp

          # Ищем и копируем картинки (добавлен boss_nahma)
          for img in ic_logo boss_kaira boss_tamasa boss_agro boss_nahma; do
            found=$(find . -maxdepth 3 -iname "${img}.png" | head -n 1)
            if [ -n "$found" ] && [ "$found" != "./app/src/main/res/drawable/${img}.png" ]; then
              cp "$found" "app/src/main/res/drawable/${img}.png"
            fi
            if [ ! -f "app/src/main/res/drawable/${img}.png" ]; then
              echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAACklEQVR4nGMAAQAABQABDQottAAAAABJRU5ErkJggg==" | base64 -d > "app/src/main/res/drawable/${img}.png"
            fi
          done

      - name: Build APK with Gradle
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aion2-Timer
          path: app/build/outputs/apk/debug/*.apk
