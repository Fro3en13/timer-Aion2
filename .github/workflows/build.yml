name: Build Aion 2 APK
on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Resources
        run: |
          mkdir -p app/src/main/res/drawable
          # Скрипт берет чистые строки из AppIcons и превращает их в реальные файлы картинок перед сборкой
          python3 -c "
          import re, base64, os
          with open('app/src/main/java/life/gamers4/aion2timer/AppIcons.kt', 'r') as f:
              code = f.read()
          def save_img(var_name, filename):
              m = re.search(var_name + r' = \"([^\"]+)\"', code)
              if m:
                  with open('app/src/main/res/drawable/' + filename, 'wb') as out:
                      out.write(base64.b64decode(m.group(1).strip()))
          save_img('LOGO_AION2_WEBP', 'ic_logo.webp')
          save_img('ICON_KAIRA_WEBP', 'boss_kaira.webp')
          save_img('ICON_TAMASA_WEBP', 'boss_tamasa.webp')
          "
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aion2-Timer-Optimized
          path: app/build/outputs/apk/debug/*.apk
