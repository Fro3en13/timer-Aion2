name: Build Aion 2 APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate App Launcher Icon
        run: |
          mkdir -p app/src/main/res/drawable
          python3 -c "
          import re, base64
          with open('app/src/main/java/life/gamers4/aion2timer/MainActivity.kt') as f:
              content = f.read()
          m = re.search(r'const val LOGO_AION2_WEBP = \"([^\"]+)\"', content)
          if m:
              with open('app/src/main/res/drawable/ic_launcher.webp', 'wb') as out:
                  out.write(base64.b64decode(m.group(1).strip()))
              print('Launcher icon generated successfully!')
          else:
              print('Warning: LOGO_AION2_WEBP not found')
          "

      - name: Build APK with Gradle
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aion2-Timer
          path: app/build/outputs/apk/debug/*.apk
